version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: alphabet_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphabet_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-alphabet_attendance}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphabet_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:alphabet_secret_password@db:5432/alphabet_attendance
      - SECRET_KEY=${SECRET_KEY:-alphabetai-super-secret-key-change-in-production-2026}
      - FACE_CONFIDENCE_THRESHOLD=0.65
      - DUPLICATE_ATTENDANCE_COOLDOWN_SECONDS=300
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphabet_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
